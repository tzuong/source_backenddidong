# Classroom LAN development only. For deployment over Internet, enable TLS/WSS.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
listener 1883 0.0.0.0
protocol mqtt
listener 9001 0.0.0.0
protocol websockets
